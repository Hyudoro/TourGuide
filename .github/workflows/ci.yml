name: CI

# When the pipeline runs
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile, test and build the jar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Copy the repository onto the runner
      - name: Checkout
        uses: actions/checkout@v5

      # 2. Install JDK 21 (required by the project's virtual threads).
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Installing the 3 jars libraries outside of the Maven central scope.
      - name: Install local dependencies (gpsUtil, tripPricer, rewardCentral)
        run: |
          ./mvnw -B install:install-file \
            -Dfile=libs/gpsUtil.jar -DgroupId=gpsUtil \
            -DartifactId=gpsUtil -Dversion=1.0.0 -Dpackaging=jar
          ./mvnw -B install:install-file \
            -Dfile=libs/TripPricer.jar -DgroupId=tripPricer \
            -DartifactId=tripPricer -Dversion=1.0.0 -Dpackaging=jar
          ./mvnw -B install:install-file \
            -Dfile=libs/RewardCentral.jar -DgroupId=rewardCentral \
            -DartifactId=rewardCentral -Dversion=1.0.0 -Dpackaging=jar

      # 4. Compile + full test suite + executable jar, in one command.
      #    The tests gate the jar: if one fails, no artifact is produced.
      - name: Compile, test and package
        run: ./mvnw -B package

      # 5. Publish the jar: downloadable from the run page
      - name: Upload the executable jar
        uses: actions/upload-artifact@v5
        with:
          name: tourguide-jar
          path: target/*.jar
          if-no-files-found: error

      # 6. Keep the test reports even when the build fails
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
